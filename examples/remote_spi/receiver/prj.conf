# Receiver: the air_quality example plus a remote SPI server
# (the shared network settings come from ../common/network.conf)

# This board's static IP (the sender is 192.168.1.10)
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.11"

# Same as examples/air_quality: display and sensor on SPI1, GPIO for the chip selects
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_SENSOR=y

# Character framebuffer with built-in fonts; its buffer is allocated from the heap
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Allow %f in snprintf to print the sensor values
CONFIG_REQUIRES_FLOAT_PRINTF=y
