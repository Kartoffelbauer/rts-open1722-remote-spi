# Network settings shared by the sender and the receiver (merged into each prj.conf)

# IPv4 + UDP sockets only
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
# Lets a socket give up waiting for data after a timeout (SO_RCVTIMEO)
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Set a static IP at boot; each board's prj.conf picks its own address
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# Wait at most 5 s for the Ethernet link at boot instead of 30 s
CONFIG_NET_CONFIG_INIT_TIMEOUT=5
