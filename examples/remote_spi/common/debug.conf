# Debug settings shared by the sender and the receiver (merged into each prj.conf)

# How much the example logs: DBG = every header field and the first bytes of
# every payload, INF = one line per transfer, WRN = only problems
CONFIG_LOG=y
CONFIG_REMOTE_SPI_LOG_LEVEL_DBG=y

# Log in the background: a log call only copies the message into this buffer,
# so logging doesn't slow down the transfers (and cause timeouts)
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192

# Shell on the serial console. Useful commands:
#   net iface              link state and IP address
#   net ping 192.168.1.11  is the other board reachable at all?
#   net stats              packets sent/received/dropped per protocol
#   log enable inf sender  change a log level at runtime, without rebuilding
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_LOG_RUNTIME_FILTERING=y

# Logging and the shell need a bit more stack than plain printk
CONFIG_MAIN_STACK_SIZE=2048
