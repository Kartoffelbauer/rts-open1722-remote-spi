# Sharp memory display and BME68x sensor over SPI (GPIO is needed for the chip selects)
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_SENSOR=y

# Character framebuffer with built-in fonts; its buffer is allocated from the heap
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Allow %f in snprintf to print the sensor values
CONFIG_REQUIRES_FLOAT_PRINTF=y
