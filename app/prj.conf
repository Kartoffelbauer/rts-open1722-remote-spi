CONFIG_GPIO=y
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# Networking: IPv4 + UDP only, static addresses come from the role .conf
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# Boot waits this many seconds for the link; the default 30 s is long with the cable unplugged
CONFIG_NET_CONFIG_INIT_TIMEOUT=5
